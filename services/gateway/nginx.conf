events {}

http {
    server {
        listen 8080;

        location /api/restaurants {
            proxy_pass http://restaurants:8001;
        }

        location /api/reservations {
            proxy_pass http://reservations:8002;
        }

        location /api/orders {
            proxy_pass http://orders:8003;
        }

        location /api/search {
            proxy_pass http://search:8004;
        }
    }
}
