AWSTemplateFormatVersion: '2010-09-09'
Description: 'AWS Restaurant Management System - 10/10 Architecture (Learner Lab Compatible)'

Parameters:
  VpcCidr:
    Type: String
    Default: 10.0.0.0/16
  DbUsername:
    Type: String
    Default: postgres_admin
  DbPassword:
    Type: String
    NoEcho: true
    Default: AdminPassword123!
  LatestAmiId:
    Type: 'AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>'
    Default: '/aws/service/ami-amazon-linux-latest/al2023-ami-kernel-6.1-x86_64'

Resources:
  # ---------------------------------------------------------
  # NETWORKING
  # ---------------------------------------------------------
  VPC:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: !Ref VpcCidr
      EnableDnsSupport: true
      EnableDnsHostnames: true

  InternetGateway:
    Type: AWS::EC2::InternetGateway
  
  VPCGatewayAttachment:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      VpcId: !Ref VPC
      InternetGatewayId: !Ref InternetGateway

  PublicSubnet1:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      CidrBlock: 10.0.1.0/24
      MapPublicIpOnLaunch: true
      AvailabilityZone: !Select [ 0, !GetAZs '' ]

  PublicSubnet2:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      CidrBlock: 10.0.2.0/24
      MapPublicIpOnLaunch: true
      AvailabilityZone: !Select [ 1, !GetAZs '' ]

  PrivateSubnet1:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      CidrBlock: 10.0.10.0/24
      MapPublicIpOnLaunch: false
      AvailabilityZone: !Select [ 0, !GetAZs '' ]

  PrivateSubnet2:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      CidrBlock: 10.0.20.0/24
      MapPublicIpOnLaunch: false
      AvailabilityZone: !Select [ 1, !GetAZs '' ]

  NatEIP:
    Type: AWS::EC2::EIP
    Properties:
      Domain: vpc

  NatGateway:
    Type: AWS::EC2::NatGateway
    Properties:
      AllocationId: !GetAtt NatEIP.AllocationId
      SubnetId: !Ref PublicSubnet1

  PublicRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref VPC

  PublicRoute:
    Type: AWS::EC2::Route
    DependsOn: VPCGatewayAttachment
    Properties:
      RouteTableId: !Ref PublicRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref InternetGateway

  PrivateRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref VPC

  PrivateRoute:
    Type: AWS::EC2::Route
    Properties:
      RouteTableId: !Ref PrivateRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      NatGatewayId: !Ref NatGateway

  Subnet1RouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnet1
      RouteTableId: !Ref PublicRouteTable

  Subnet2RouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnet2
      RouteTableId: !Ref PublicRouteTable

  PrivateSubnet1RouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PrivateSubnet1
      RouteTableId: !Ref PrivateRouteTable

  PrivateSubnet2RouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PrivateSubnet2
      RouteTableId: !Ref PrivateRouteTable

  # ---------------------------------------------------------
  # PRIVATE DNS
  # ---------------------------------------------------------
  PrivateHostedZone:
    Type: AWS::Route53::HostedZone
    Properties:
      Name: internal
      HostedZoneConfig:
        Comment: "Internal DNS for Microservices"
      VPCs:
        - VPCId: !Ref VPC
          VPCRegion: !Ref "AWS::Region"

  # ---------------------------------------------------------
  # SECURITY GROUPS
  # ---------------------------------------------------------
  AlbSG:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Allow HTTP/HTTPS from Internet to ALB
      VpcId: !Ref VPC
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: 0.0.0.0/0
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: 0.0.0.0/0

  RestaurantSG:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Restaurant Service SG
      VpcId: !Ref VPC
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 8001
          ToPort: 8001
          SourceSecurityGroupId: !Ref AlbSG

  OrderingSG:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Ordering Service SG
      VpcId: !Ref VPC
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 8003
          ToPort: 8003
          SourceSecurityGroupId: !Ref AlbSG

  ReservationSG:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Reservation Service SG
      VpcId: !Ref VPC
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 8002
          ToPort: 8002
          SourceSecurityGroupId: !Ref AlbSG
        - IpProtocol: tcp
          FromPort: 8002
          ToPort: 8002
          SourceSecurityGroupId: !Ref OrderingSG

  SearchSG:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Search Service SG
      VpcId: !Ref VPC
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 8004
          ToPort: 8004
          SourceSecurityGroupId: !Ref AlbSG

  RdsSG:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: RDS PostgreSQL SG
      VpcId: !Ref VPC
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 5432
          ToPort: 5432
          SourceSecurityGroupId: !Ref RestaurantSG
        - IpProtocol: tcp
          FromPort: 5432
          ToPort: 5432
          SourceSecurityGroupId: !Ref ReservationSG
        - IpProtocol: tcp
          FromPort: 5432
          ToPort: 5432
          SourceSecurityGroupId: !Ref OrderingSG
        - IpProtocol: tcp
          FromPort: 5432
          ToPort: 5432
          SourceSecurityGroupId: !Ref SearchSG

  # ---------------------------------------------------------
  # STORAGE & CDN
  # ---------------------------------------------------------
  ImageBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub "restaurant-assets-${AWS::AccountId}-${AWS::Region}"
      VersioningConfiguration:
        Status: Enabled
      # We removed the PublicAccessBlockConfiguration so that standard
      # bucket policies can allow public read if needed.
      # CloudFront has been completely removed.

  BucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref ImageBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: "*"
            Action: s3:GetObject
            Resource: !Sub "${ImageBucket.Arn}/*"

  # ---------------------------------------------------------
  # MESSAGING
  # ---------------------------------------------------------
  ReservationTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: reservation-notifications

  # ---------------------------------------------------------
  # DATABASE (RDS)
  # ---------------------------------------------------------
  DBSubnetGroup:
    Type: AWS::RDS::DBSubnetGroup
    Properties:
      DBSubnetGroupDescription: RDS Subnet Group
      SubnetIds:
        - !Ref PrivateSubnet1
        - !Ref PrivateSubnet2

  Database:
    Type: AWS::RDS::DBInstance
    Properties:
      Engine: postgres
      EngineVersion: "15"
      DBInstanceClass: db.t3.micro
      AllocatedStorage: 20
      DBName: postgres
      MasterUsername: !Ref DbUsername
      MasterUserPassword: !Ref DbPassword
      DBSubnetGroupName: !Ref DBSubnetGroup
      VPCSecurityGroups:
        - !Ref RdsSG
      PubliclyAccessible: false
      BackupRetentionPeriod: 7
      DeletionProtection: true

  # ---------------------------------------------------------
  # LOAD BALANCER & TARGET GROUPS
  # ---------------------------------------------------------
  ApplicationLoadBalancer:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Properties:
      Scheme: internet-facing
      Subnets:
        - !Ref PublicSubnet1
        - !Ref PublicSubnet2
      SecurityGroups:
        - !Ref AlbSG

  ALBListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref ApplicationLoadBalancer
      Port: 80
      Protocol: HTTP
      DefaultActions:
        - Type: fixed-response
          FixedResponseConfig:
            StatusCode: '404'
            ContentType: text/plain

  RestaurantTG:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      VpcId: !Ref VPC
      Port: 8001
      Protocol: HTTP
      HealthCheckPath: /api/restaurants
      Matcher:
        HttpCode: 200,301,302,404

  ReservationTG:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      VpcId: !Ref VPC
      Port: 8002
      Protocol: HTTP
      HealthCheckPath: /health

  OrderingTG:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      VpcId: !Ref VPC
      Port: 8003
      Protocol: HTTP
      HealthCheckPath: /health

  SearchTG:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      VpcId: !Ref VPC
      Port: 8004
      Protocol: HTTP
      HealthCheckPath: /health

  RestaurantListenerRule:
    Type: AWS::ElasticLoadBalancingV2::ListenerRule
    Properties:
      ListenerArn: !Ref ALBListener
      Priority: 10
      Conditions:
        - Field: path-pattern
          Values: ['/api/restaurants*']
      Actions:
        - Type: forward
          TargetGroupArn: !Ref RestaurantTG

  ReservationListenerRule:
    Type: AWS::ElasticLoadBalancingV2::ListenerRule
    Properties:
      ListenerArn: !Ref ALBListener
      Priority: 20
      Conditions:
        - Field: path-pattern
          Values: ['/api/reservations*']
      Actions:
        - Type: forward
          TargetGroupArn: !Ref ReservationTG

  OrderingListenerRule:
    Type: AWS::ElasticLoadBalancingV2::ListenerRule
    Properties:
      ListenerArn: !Ref ALBListener
      Priority: 30
      Conditions:
        - Field: path-pattern
          Values: ['/api/orders*']
      Actions:
        - Type: forward
          TargetGroupArn: !Ref OrderingTG

  SearchListenerRule:
    Type: AWS::ElasticLoadBalancingV2::ListenerRule
    Properties:
      ListenerArn: !Ref ALBListener
      Priority: 40
      Conditions:
        - Field: path-pattern
          Values: ['/api/search*']
      Actions:
        - Type: forward
          TargetGroupArn: !Ref SearchTG

  # ---------------------------------------------------------
  # ECR REPOSITORIES
  # ---------------------------------------------------------
  RestaurantRepo:
    Type: AWS::ECR::Repository
    Properties:
      RepositoryName: aws-restaurant-management-restaurant
  ReservationRepo:
    Type: AWS::ECR::Repository
    Properties:
      RepositoryName: aws-restaurant-management-reservation
  OrderingRepo:
    Type: AWS::ECR::Repository
    Properties:
      RepositoryName: aws-restaurant-management-ordering
  SearchRepo:
    Type: AWS::ECR::Repository
    Properties:
      RepositoryName: aws-restaurant-management-search

  # ---------------------------------------------------------
  # AUTO SCALING & LAUNCH TEMPLATES
  # ---------------------------------------------------------
  RestaurantLT:
    Type: AWS::EC2::LaunchTemplate
    Properties:
      LaunchTemplateData:
        ImageId: !Ref LatestAmiId
        InstanceType: t3.micro
        KeyName: vockey
        IamInstanceProfile:
          Name: LabInstanceProfile
        SecurityGroupIds:
          - !Ref RestaurantSG
        UserData:
          Fn::Base64: !Sub |
            #!/bin/bash
            yum update -y
            yum install -y docker postgresql15
            systemctl start docker
            systemctl enable docker
            
            # Register in Route53 Private Hosted Zone
            INSTANCE_ID=$(curl -s http://169.254.169.254/latest/meta-data/instance-id)
            IP=$(curl -s http://169.254.169.254/latest/meta-data/local-ipv4)
            cat <<EOF > route53-batch.json
            {
              "Comment": "Registering EC2 Instance",
              "Changes": [
                {
                  "Action": "UPSERT",
                  "ResourceRecordSet": {
                    "Name": "restaurant.internal.",
                    "Type": "A",
                    "SetIdentifier": "$INSTANCE_ID",
                    "MultiValueAnswer": true,
                    "TTL": 60,
                    "ResourceRecords": [{ "Value": "$IP" }]
                  }
                }
              ]
            }
            EOF
            aws route53 change-resource-record-sets --hosted-zone-id ${PrivateHostedZone} --change-batch file://route53-batch.json
            
            # Pull image
            aws ecr get-login-password --region ${AWS::Region} | docker login --username AWS --password-stdin ${AWS::AccountId}.dkr.ecr.${AWS::Region}.amazonaws.com
            docker pull ${AWS::AccountId}.dkr.ecr.${AWS::Region}.amazonaws.com/aws-restaurant-management-restaurant:latest
            
            # Run Migrations
            docker run --rm --entrypoint cat ${AWS::AccountId}.dkr.ecr.${AWS::Region}.amazonaws.com/aws-restaurant-management-restaurant:latest /app/dist/schema.sql > /tmp/schema.sql
            export PGPASSWORD=${DbPassword}
            psql -tc "SELECT 1 FROM pg_database WHERE datname = 'restaurant_db'" -h ${Database.Endpoint.Address} -U ${DbUsername} -d postgres | grep -q 1 || psql -h ${Database.Endpoint.Address} -U ${DbUsername} -d postgres -c "CREATE DATABASE restaurant_db;"
            psql -tc "SELECT 1 FROM pg_roles WHERE rolname='restaurant_user'" -h ${Database.Endpoint.Address} -U ${DbUsername} -d postgres | grep -q 1 || psql -h ${Database.Endpoint.Address} -U ${DbUsername} -d postgres -c "CREATE USER restaurant_user WITH PASSWORD 'restaurant_pass';"
            psql -h ${Database.Endpoint.Address} -U ${DbUsername} -d postgres -c "GRANT ALL PRIVILEGES ON DATABASE restaurant_db TO restaurant_user;"
            psql -h ${Database.Endpoint.Address} -U ${DbUsername} -d restaurant_db -f /tmp/schema.sql
            
            # Run app
            docker run -d -p 8001:8001 \
              -e DATABASE_URL=postgres://restaurant_user:restaurant_pass@${Database.Endpoint.Address}:5432/restaurant_db \
              -e S3_BUCKET=${ImageBucket} \
              ${AWS::AccountId}.dkr.ecr.${AWS::Region}.amazonaws.com/aws-restaurant-management-restaurant:latest

  RestaurantASG:
    Type: AWS::AutoScaling::AutoScalingGroup
    Properties:
      VPCZoneIdentifier:
        - !Ref PrivateSubnet1
        - !Ref PrivateSubnet2
      LaunchTemplate:
        LaunchTemplateId: !Ref RestaurantLT
        Version: !GetAtt RestaurantLT.LatestVersionNumber
      MinSize: '1'
      MaxSize: '2'
      DesiredCapacity: '1'
      TargetGroupARNs:
        - !Ref RestaurantTG

  ReservationLT:
    Type: AWS::EC2::LaunchTemplate
    Properties:
      LaunchTemplateData:
        ImageId: !Ref LatestAmiId
        InstanceType: t3.micro
        KeyName: vockey
        IamInstanceProfile:
          Name: LabInstanceProfile
        SecurityGroupIds:
          - !Ref ReservationSG
        UserData:
          Fn::Base64: !Sub |
            #!/bin/bash
            yum update -y
            yum install -y docker postgresql15
            systemctl start docker
            systemctl enable docker
            
            # Register in Route53 Private Hosted Zone
            INSTANCE_ID=$(curl -s http://169.254.169.254/latest/meta-data/instance-id)
            IP=$(curl -s http://169.254.169.254/latest/meta-data/local-ipv4)
            cat <<EOF > route53-batch.json
            {
              "Comment": "Registering EC2 Instance",
              "Changes": [
                {
                  "Action": "UPSERT",
                  "ResourceRecordSet": {
                    "Name": "reservation.internal.",
                    "Type": "A",
                    "SetIdentifier": "$INSTANCE_ID",
                    "MultiValueAnswer": true,
                    "TTL": 60,
                    "ResourceRecords": [{ "Value": "$IP" }]
                  }
                }
              ]
            }
            EOF
            aws route53 change-resource-record-sets --hosted-zone-id ${PrivateHostedZone} --change-batch file://route53-batch.json
            
            # Pull image
            aws ecr get-login-password --region ${AWS::Region} | docker login --username AWS --password-stdin ${AWS::AccountId}.dkr.ecr.${AWS::Region}.amazonaws.com
            docker pull ${AWS::AccountId}.dkr.ecr.${AWS::Region}.amazonaws.com/aws-restaurant-management-reservation:latest
            
            # Run Migrations
            docker run --rm --entrypoint cat ${AWS::AccountId}.dkr.ecr.${AWS::Region}.amazonaws.com/aws-restaurant-management-reservation:latest /app/dist/schema.sql > /tmp/schema.sql
            export PGPASSWORD=${DbPassword}
            psql -tc "SELECT 1 FROM pg_database WHERE datname = 'reservation_db'" -h ${Database.Endpoint.Address} -U ${DbUsername} -d postgres | grep -q 1 || psql -h ${Database.Endpoint.Address} -U ${DbUsername} -d postgres -c "CREATE DATABASE reservation_db;"
            psql -tc "SELECT 1 FROM pg_roles WHERE rolname='reservation_user'" -h ${Database.Endpoint.Address} -U ${DbUsername} -d postgres | grep -q 1 || psql -h ${Database.Endpoint.Address} -U ${DbUsername} -d postgres -c "CREATE USER reservation_user WITH PASSWORD 'reservation_pass';"
            psql -h ${Database.Endpoint.Address} -U ${DbUsername} -d postgres -c "GRANT ALL PRIVILEGES ON DATABASE reservation_db TO reservation_user;"
            psql -h ${Database.Endpoint.Address} -U ${DbUsername} -d reservation_db -f /tmp/schema.sql
            
            # Run app
            docker run -d -p 8002:8002 \
              -e DATABASE_URL=postgres://reservation_user:reservation_pass@${Database.Endpoint.Address}:5432/reservation_db \
              -e RESTAURANT_SERVICE_URL=http://restaurant.internal:8001 \
              ${AWS::AccountId}.dkr.ecr.${AWS::Region}.amazonaws.com/aws-restaurant-management-reservation:latest

  ReservationASG:
    Type: AWS::AutoScaling::AutoScalingGroup
    Properties:
      VPCZoneIdentifier:
        - !Ref PrivateSubnet1
        - !Ref PrivateSubnet2
      LaunchTemplate:
        LaunchTemplateId: !Ref ReservationLT
        Version: !GetAtt ReservationLT.LatestVersionNumber
      MinSize: '1'
      MaxSize: '2'
      DesiredCapacity: '1'
      TargetGroupARNs:
        - !Ref ReservationTG

  OrderingLT:
    Type: AWS::EC2::LaunchTemplate
    Properties:
      LaunchTemplateData:
        ImageId: !Ref LatestAmiId
        InstanceType: t3.micro
        KeyName: vockey
        IamInstanceProfile:
          Name: LabInstanceProfile
        SecurityGroupIds:
          - !Ref OrderingSG
        UserData:
          Fn::Base64: !Sub |
            #!/bin/bash
            yum update -y
            yum install -y docker postgresql15
            systemctl start docker
            systemctl enable docker
            
            # Register in Route53 Private Hosted Zone
            INSTANCE_ID=$(curl -s http://169.254.169.254/latest/meta-data/instance-id)
            IP=$(curl -s http://169.254.169.254/latest/meta-data/local-ipv4)
            cat <<EOF > route53-batch.json
            {
              "Comment": "Registering EC2 Instance",
              "Changes": [
                {
                  "Action": "UPSERT",
                  "ResourceRecordSet": {
                    "Name": "ordering.internal.",
                    "Type": "A",
                    "SetIdentifier": "$INSTANCE_ID",
                    "MultiValueAnswer": true,
                    "TTL": 60,
                    "ResourceRecords": [{ "Value": "$IP" }]
                  }
                }
              ]
            }
            EOF
            aws route53 change-resource-record-sets --hosted-zone-id ${PrivateHostedZone} --change-batch file://route53-batch.json
            
            # Pull image
            aws ecr get-login-password --region ${AWS::Region} | docker login --username AWS --password-stdin ${AWS::AccountId}.dkr.ecr.${AWS::Region}.amazonaws.com
            docker pull ${AWS::AccountId}.dkr.ecr.${AWS::Region}.amazonaws.com/aws-restaurant-management-ordering:latest
            
            # Run Migrations
            docker run --rm --entrypoint cat ${AWS::AccountId}.dkr.ecr.${AWS::Region}.amazonaws.com/aws-restaurant-management-ordering:latest /app/dist/schema.sql > /tmp/schema.sql
            export PGPASSWORD=${DbPassword}
            psql -tc "SELECT 1 FROM pg_database WHERE datname = 'ordering_db'" -h ${Database.Endpoint.Address} -U ${DbUsername} -d postgres | grep -q 1 || psql -h ${Database.Endpoint.Address} -U ${DbUsername} -d postgres -c "CREATE DATABASE ordering_db;"
            psql -tc "SELECT 1 FROM pg_roles WHERE rolname='ordering_user'" -h ${Database.Endpoint.Address} -U ${DbUsername} -d postgres | grep -q 1 || psql -h ${Database.Endpoint.Address} -U ${DbUsername} -d postgres -c "CREATE USER ordering_user WITH PASSWORD 'ordering_pass';"
            psql -h ${Database.Endpoint.Address} -U ${DbUsername} -d postgres -c "GRANT ALL PRIVILEGES ON DATABASE ordering_db TO ordering_user;"
            psql -h ${Database.Endpoint.Address} -U ${DbUsername} -d ordering_db -f /tmp/schema.sql
            
            # Run app
            docker run -d -p 8003:8003 \
              -e DATABASE_URL=postgres://ordering_user:ordering_pass@${Database.Endpoint.Address}:5432/ordering_db \
              -e RESTAURANT_SERVICE_URL=http://restaurant.internal:8001 \
              -e RESERVATION_SERVICE_URL=http://reservation.internal:8002 \
              ${AWS::AccountId}.dkr.ecr.${AWS::Region}.amazonaws.com/aws-restaurant-management-ordering:latest

  OrderingASG:
    Type: AWS::AutoScaling::AutoScalingGroup
    Properties:
      VPCZoneIdentifier:
        - !Ref PrivateSubnet1
        - !Ref PrivateSubnet2
      LaunchTemplate:
        LaunchTemplateId: !Ref OrderingLT
        Version: !GetAtt OrderingLT.LatestVersionNumber
      MinSize: '1'
      MaxSize: '2'
      DesiredCapacity: '1'
      TargetGroupARNs:
        - !Ref OrderingTG

  SearchLT:
    Type: AWS::EC2::LaunchTemplate
    Properties:
      LaunchTemplateData:
        ImageId: !Ref LatestAmiId
        InstanceType: t3.micro
        KeyName: vockey
        IamInstanceProfile:
          Name: LabInstanceProfile
        SecurityGroupIds:
          - !Ref SearchSG
        UserData:
          Fn::Base64: !Sub |
            #!/bin/bash
            yum update -y
            yum install -y docker postgresql15
            systemctl start docker
            systemctl enable docker
            
            # Register in Route53 Private Hosted Zone
            INSTANCE_ID=$(curl -s http://169.254.169.254/latest/meta-data/instance-id)
            IP=$(curl -s http://169.254.169.254/latest/meta-data/local-ipv4)
            cat <<EOF > route53-batch.json
            {
              "Comment": "Registering EC2 Instance",
              "Changes": [
                {
                  "Action": "UPSERT",
                  "ResourceRecordSet": {
                    "Name": "search.internal.",
                    "Type": "A",
                    "SetIdentifier": "$INSTANCE_ID",
                    "MultiValueAnswer": true,
                    "TTL": 60,
                    "ResourceRecords": [{ "Value": "$IP" }]
                  }
                }
              ]
            }
            EOF
            aws route53 change-resource-record-sets --hosted-zone-id ${PrivateHostedZone} --change-batch file://route53-batch.json
            
            # Pull image
            aws ecr get-login-password --region ${AWS::Region} | docker login --username AWS --password-stdin ${AWS::AccountId}.dkr.ecr.${AWS::Region}.amazonaws.com
            docker pull ${AWS::AccountId}.dkr.ecr.${AWS::Region}.amazonaws.com/aws-restaurant-management-search:latest
            
            # Search doesn't have migrations currently.
            
            # Run app
            docker run -d -p 8004:8004 \
              -e RESTAURANT_SERVICE_URL=http://restaurant.internal:8001 \
              ${AWS::AccountId}.dkr.ecr.${AWS::Region}.amazonaws.com/aws-restaurant-management-search:latest

  SearchASG:
    Type: AWS::AutoScaling::AutoScalingGroup
    Properties:
      VPCZoneIdentifier:
        - !Ref PrivateSubnet1
        - !Ref PrivateSubnet2
      LaunchTemplate:
        LaunchTemplateId: !Ref SearchLT
        Version: !GetAtt SearchLT.LatestVersionNumber
      MinSize: '1'
      MaxSize: '2'
      DesiredCapacity: '1'
      TargetGroupARNs:
        - !Ref SearchTG

  # ---------------------------------------------------------
  # CLOUDTRAIL
  # ---------------------------------------------------------
  TrailBucket:
    Type: AWS::S3::Bucket
  TrailBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref TrailBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: cloudtrail.amazonaws.com
            Action: s3:GetBucketAcl
            Resource: !GetAtt TrailBucket.Arn
          - Effect: Allow
            Principal:
              Service: cloudtrail.amazonaws.com
            Action: s3:PutObject
            Resource: !Sub "${TrailBucket.Arn}/AWSLogs/${AWS::AccountId}/*"
            Condition:
              StringEquals:
                s3:x-amz-acl: bucket-owner-full-control
  AuditTrail:
    Type: AWS::CloudTrail::Trail
    DependsOn: TrailBucketPolicy
    Properties:
      IsLogging: true
      S3BucketName: !Ref TrailBucket

Outputs:
  LoadBalancerUrl:
    Value: !Sub "http://${ApplicationLoadBalancer.DNSName}"
  S3BucketUrl:
    Value: !Sub "https://${ImageBucket}.s3.amazonaws.com"
